[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-interlock"
version = "0.1.5"
description = "Fail-closed media reconciliation, publication, and acquisition control"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {text = "MIT"}
authors = [{name = "MediaInterlock contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
media-interlock-fence = "media_interlock.fence.cli:main"
media-interlock-publisher = "media_interlock.publisher.cli:main"
media-interlock-reconciler = "media_interlock.reconciler.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
